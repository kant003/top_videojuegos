<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeste - Juego de Plataformas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Celeste</h1>
    </header>

    <main class="container">
        <!-- Mínimo una foto -->
        <div class="card-image">
            <img src="https://cdn.mobygames.com/covers/1477570-celeste-nintendo-switch-front-cover.jpg" alt="Celeste Game Cover">
        </div>

        <!-- Descripción breve del juego -->
        <section class="description">
            <h2>Descripción</h2>
            <p>
                <strong>Celeste</strong> es un aclamado juego de plataformas indie donde ayudas a Madeline a sobrevivir a sus demonios internos en su viaje hacia la cumbre de la Montaña Celeste. Un desafío preciso y lleno de superación.
            </p>
            <button id="likeBtn">❤️ (<span id="likes">0</span>)</button>
        </section>
    </main>

    <!-- Nombre del autor de la página -->
    <footer>
        <p><strong>Marcos Gonzalez Chamorro</strong></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
